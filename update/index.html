<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Маршрут</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: рабочий планшет — шапка со сводкой, вкладки видов, широкие таблицы в собственных прокрутках */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202e; --muted:#5b6577; --line:#dce1e9; --soft:#eaeef4;
  --accent:#2c4ca3; --cong:#2c4ca3; --group:#a8691a; --ok:#2b7a4b; --warn:#a96c0e; --bad:#c03d2a; --special:#7b4dae; --plan:#2563d9; --mS:70%; --mL:83%;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#191e26; --ink:#e5e9f0; --muted:#98a2b3; --line:#2a313d; --soft:#212833;
  --accent:#8ea8ff; --cong:#8ea8ff; --group:#e1a54d; --ok:#5cc186; --warn:#e4b14f; --bad:#f07c66; --special:#b994ec; --plan:#6ea2ff; --mS:32%; --mL:30%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191e26; --ink:#e5e9f0; --muted:#98a2b3; --line:#2a313d; --soft:#212833;
  --accent:#8ea8ff; --cong:#8ea8ff; --group:#e1a54d; --ok:#5cc186; --warn:#e4b14f; --bad:#f07c66; --special:#b994ec; --plan:#6ea2ff; --mS:32%; --mL:30%; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1260px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:12.5px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw.c{background:var(--cong)} .sw.g{background:var(--group)}
.sw.p{border:1.5px dashed var(--muted);background:transparent}
.sw.s{background:color-mix(in srgb,var(--special) 35%,transparent);border-radius:2px}
.sw.a{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 45%,transparent) 0 3px,transparent 3px 6px);border-radius:2px;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent)}
.band.av{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 16%,transparent) 0 6px,transparent 6px 12px)}
.wk.av{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 10%,var(--surface)) 0 8px,var(--surface) 8px 16px)}
.wkc.av{fill:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.it.spl.avs{color:var(--warn)}
.brows{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:150px 150px minmax(160px,1fr) 150px 80px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.brow .lv-no{color:var(--special)} .brow .lv-avoid{color:var(--warn)}
.bhead{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--soft);border-radius:10px 10px 0 0}
.dur{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.brow{grid-template-columns:1fr 1fr}.brow input[type=text]{grid-column:1/-1}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.special b{color:var(--special)} .stat.ok b{color:var(--ok)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{font-size:13px;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.special{background:color-mix(in srgb,var(--special) 10%,var(--surface));border-color:color-mix(in srgb,var(--special) 35%,transparent)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--ink);background:var(--soft)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.nm .tag,.nmrow .tag{margin-left:6px;font-size:10px}
.unit{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.unit span{color:var(--muted);font-size:12.5px;padding:0 8px 0 6px}
.unit button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer}
.unit button[aria-checked="true"]{background:var(--accent);color:var(--surface)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:80ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
tr.sect td{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:7px 12px}
td.name{min-width:200px}
.nm{font-weight:600}
.city{color:var(--muted);font-size:12.5px}
.cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:150px}
.dash{color:var(--muted)}

.chip{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.c{color:var(--cong);border-color:color-mix(in srgb,var(--cong) 40%,transparent);background:color-mix(in srgb,var(--cong) 10%,transparent)}
.chip.g{color:var(--group);border-color:color-mix(in srgb,var(--group) 45%,transparent);background:color-mix(in srgb,var(--group) 11%,transparent)}
.chip.proj{border-style:dashed;background:transparent}
.chip.special{color:var(--special);border-color:var(--special)}
.chip.conflict{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.iv{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.pill{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted)}
.note .bad,.note .special{font-weight:500}
.special{color:var(--special)}

/* Шкала */
.tl{min-width:1500px;position:relative}
.tl-head,.tl-row{display:grid;grid-template-columns:270px 1fr}
.nmrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.nmrow .nm{margin-right:3px}
.ivb{min-width:24px;height:24px;padding:0 5px;border-radius:12px;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;border:1.5px solid currentColor;background:color-mix(in srgb,currentColor 14%,transparent);cursor:default}
.ivb.none{color:var(--muted);border-style:dashed;background:transparent}
.ivb.ok{color:var(--ok)} .ivb.warn{color:var(--warn)} .ivb.bad{color:var(--bad)}
.tl-head .tr{position:relative;height:44px;border-bottom:1px solid var(--line)}
.tl-label{padding:8px 12px;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:3}
.tl-row{border-bottom:1px solid var(--line)}
.tl-row.sect{background:var(--bg)}
.tl-row.sect .tl-label{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tr{position:relative;height:46px}
.band{position:absolute;top:0;bottom:0}
.band.alt{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.band.sp{background:color-mix(in srgb,var(--special) 13%,transparent)}
.mtick{position:absolute;bottom:4px;font-size:11px;color:var(--muted);transform:translateX(3px);white-space:nowrap}
.mline{position:absolute;bottom:0;height:8px;border-left:1px solid var(--line)}
.hlabel{position:absolute;top:5px;font-size:11px;font-weight:600;color:var(--ink);transform:translateX(4px);white-space:nowrap}
.today{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--bad);z-index:2}
.today span{position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--bad);white-space:nowrap}
.win{position:absolute;top:13px;height:20px;border-radius:4px}
.win.c{background:color-mix(in srgb,var(--cong) 13%,transparent);border:1px dashed color-mix(in srgb,var(--cong) 45%,transparent)}
.win.g{background:color-mix(in srgb,var(--group) 13%,transparent);border:1px dashed color-mix(in srgb,var(--group) 45%,transparent)}
.recommend-mark{position:absolute;top:12px;height:22px;border-left:2px solid color-mix(in srgb,var(--ok) 62%,transparent);z-index:2;pointer-events:none}
.seg{position:absolute;top:23px;height:0;border-top:2px solid}
.seg.ok{border-color:var(--ok)} .seg.warn{border-color:var(--warn)} .seg.bad{border-color:var(--bad)}
.seg.proj{border-top:2px dashed var(--muted)}
.seg span{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;background:var(--surface);padding:0 3px;border-radius:3px;white-space:nowrap}
.dot{position:absolute;top:17px;width:12px;height:12px;border-radius:50%;transform:translateX(-6px);z-index:1;border:2px solid var(--surface)}
.dot.c{background:var(--cong)} .dot.g{background:var(--group)}
.dot.proj{background:var(--surface);border:2px dashed var(--muted)}
.dot.proj.special{border-color:var(--special)}
.dot.conflict{box-shadow:0 0 0 2px var(--bad)}

/* Недели */
.months{display:flex;flex-direction:column;gap:14px}
.weeks-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
#weeks{grid-column:1;grid-row:1}
.week-coverage{grid-column:2;grid-row:1}
.week-coverage{position:sticky;top:12px;z-index:3;max-height:calc(100vh - 30px);overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 4px 16px rgba(20,35,26,.07)}
.coverage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 9px;font-size:12px}
.coverage-head>span{color:var(--muted);font-size:10px}
.coverage-group{padding:9px 0;border-top:1px solid var(--line)}
.coverage-group header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 6px;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:10.5px;letter-spacing:0;text-transform:none;box-shadow:none}
.coverage-group header b{flex:none;min-width:20px;padding:2px 5px;border-radius:10px;background:var(--soft);color:var(--ink);font:11px var(--f-mono);text-align:center}
.coverage-group p{margin:0;color:var(--ok);font-size:10.5px}
.coverage-names{display:flex;flex-wrap:wrap;gap:4px}
.coverage-names span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 6px;border-radius:5px;background:var(--soft);color:var(--ink);font-size:10px;line-height:1.25}
.coverage-names span[draggable="true"]{cursor:grab;touch-action:none}.coverage-names span[draggable="true"]:hover{background:color-mix(in srgb,var(--accent) 15%,var(--soft));color:var(--accent)}

.month{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start}
.month h3{margin:6px 0 0;font-size:14px;font-weight:600}
.month h3 small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.weeks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:var(--surface);display:flex;flex-direction:column;gap:5px;min-height:78px;min-width:0}
.wk .wd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.wk.free{border-style:dashed;background:transparent}
.wk.free .wd b{color:var(--ok);font-family:var(--f-body);font-weight:500}
.wk.sp{background:color-mix(in srgb,var(--special) 9%,var(--surface))}
.wk.past{opacity:.5}
.wk.clash{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.it{font-size:12px;line-height:1.3;padding:3px 6px;border-radius:4px;overflow-wrap:anywhere}
.it.c{background:color-mix(in srgb,var(--cong) 13%,transparent);color:var(--cong)}
.it.g{background:color-mix(in srgb,var(--group) 14%,transparent);color:var(--group)}
.it.ev{background:var(--soft);color:var(--muted)}
.it.proj{background:transparent;border:1px dashed currentColor}
.it.spl{color:var(--special);background:transparent;padding:0 2px;font-size:11px}

/* Данные */
.drows{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dname{display:flex;flex-direction:column;gap:6px;min-width:0}
.dvis{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tag.c{color:var(--cong)} .tag.g{color:var(--group)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=date]{font-family:var(--f-mono);font-size:13px}
.dv{display:inline-flex;align-items:center;gap:2px}
.last-visit{display:flex;flex-direction:column;gap:4px;min-width:180px;color:var(--muted);font-size:11px}
.travel-mode{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px}
.travel-mode select{min-width:180px;color:var(--ink)}
.date-sections{display:flex;flex-direction:column;gap:12px}
.date-section{overflow:hidden}
.date-section h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--soft);font-size:12px;color:var(--muted)}
.date-row{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.date-identity{display:flex;flex-direction:column;gap:4px;min-width:0}.date-identity b{font-size:13px}.date-identity .city{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-entries{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}.date-entry{display:inline-flex;align-items:center;gap:3px}
.date-empty{margin:0;color:var(--muted);font-size:12px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.x{padding:4px 8px;color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad)}
.addf{display:flex;flex-wrap:wrap;gap:8px;padding:14px;align-items:center}
.addf input{flex:1 1 180px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}

/* Круговой календарь */
.wheel-sec{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid var(--line)}
.wheel-sec h2{font-size:18px;margin:0 0 6px}
.wheel-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.wheel-top .hint{margin:0}
.yearsel{display:inline-flex;align-items:center;gap:8px}
.yearsel span{font-size:15px;min-width:96px;text-align:center}
.yearsel .btn:disabled{opacity:.35;cursor:default}
.wheel-body{display:grid;grid-template-columns:minmax(0,660px) minmax(220px,1fr);gap:24px;align-items:start}
.wheel-box{min-width:0}
#wheel{width:100%;height:auto;display:block}
#wheel [data-id]{cursor:pointer}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;font-size:13px}
.wlist li{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;cursor:pointer}
.wlist li:hover,.wlist li.on{background:var(--soft)}
.wlist li.on{box-shadow:inset 0 0 0 1px var(--line)}
.wlist .rn{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:20px;text-align:right;flex:none}
.wlist .city{font-size:11.5px}
.okc{color:var(--ok)} .planc{color:var(--plan)}
.wm{fill:hsl(var(--h) var(--mS) var(--mL));stroke:var(--bg);stroke-width:2}
.wmt{fill:var(--ink);font-family:var(--f-body);font-size:12.5px;font-weight:600;letter-spacing:.08em}
.wkc{fill:var(--surface);stroke:var(--line);stroke-width:.7}
.wkc.ev{fill:var(--line)} .wkc.sp{fill:color-mix(in srgb,var(--special) 35%,var(--surface))} .wkc.now{fill:var(--bad)}
.track{fill:var(--soft)}
.due{fill:var(--ok);opacity:.6}
.plan{fill:var(--plan)}
.plan.conflict{fill:var(--bad)}
.ring{transition:opacity .15s}
.dim .ring{opacity:.15} .dim .ring.on{opacity:1}
.ctr{fill:var(--surface);stroke:var(--line)}
.ct1{fill:var(--ink);font-weight:700;font-family:var(--f-body)}
.ct2{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.halfline{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3;opacity:.45}
.nowline{stroke:var(--bad);stroke-width:1.2}
@media (max-width:900px){.wheel-body{grid-template-columns:1fr}}
/* Импорт / экспорт */
.iobar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.imp{padding:14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent) 6%,var(--surface));display:flex;flex-direction:column;gap:10px;border-radius:10px 10px 0 0}
.imp h3{margin:0;font-size:15px}
.imp .scroll{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.imp td,.imp th{padding:6px 10px}
.imp select{max-width:260px}
.imp .acts{display:flex;gap:8px;flex-wrap:wrap}
.badge-new{color:var(--ok);font-size:12px;font-weight:600}
/* Черновик */
#draftbar:empty{display:none}
.dbar{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.dbar.idle{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;background:transparent;border-style:dashed}
.dbar.on{border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
.dhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.dhead b{font-size:15px;color:var(--warn)}
.dacts{display:flex;gap:8px;margin-left:auto}
.dgrid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:14px;align-items:start}
.dcmp td,.dcmp th{padding:5px 10px}
.dch h4{margin:0 0 6px;font-size:13px}
.dch ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:220px;overflow:auto}
.dch s{color:var(--bad)}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}.dacts{margin-left:0}}
/* Подбор */
.sugbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}

.app-sidebar{background:color-mix(in srgb,var(--bg) 72%,var(--surface));padding:25px 15px 16px}

.brandmark{width:32px;height:32px;border-radius:10px;box-shadow:0 2px 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.side-route{padding:11px 12px;margin:0 5px 23px;border:1px solid var(--line);background:var(--surface)}
.nav-label{margin-top:17px;margin-bottom:7px;font-size:9px;letter-spacing:.12em}
.side-nav{gap:2px}
.side-nav button{min-height:37px;border-radius:7px;font-size:13px;color:var(--muted)}
.side-nav button:before{width:6px;height:6px;margin-right:12px;border-radius:50%}
.side-nav button.active{background:color-mix(in srgb,var(--accent) 9%,var(--surface));box-shadow:inset 2px 0 var(--accent)}
.app-main{gap:21px;padding:25px clamp(24px,3.6vw,52px) 52px;background:var(--bg)}
header.appbar{padding-bottom:15px}
header.appbar .btn{border-color:transparent;background:transparent;color:var(--muted)}
header.appbar .btn:hover{background:var(--soft);color:var(--ink)}
#view-overview{gap:17px}
#view-overview .page-heading{align-items:center;margin:0 0 1px}
#view-overview .page-heading h2{font-size:25px}
#view-overview .page-heading p{font-size:13px}
#view-overview .page-heading>.btn{white-space:nowrap}
#welcome .welcome{padding:13px 16px;border-radius:10px}
#welcome .welcome p{margin:3px 0 0;font-size:12px}
#welcome .sbtns{gap:6px}
#draftbar .dbar.idle{padding:0;border:0;gap:8px;color:var(--muted);font-size:12px}
#draftbar .dbar.idle .idle-label{display:none}
#draftbar .dbar.idle .text-action{padding:0}
.overview-focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.focus-stat{position:relative;display:flex;flex-direction:column;gap:7px;min-height:82px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.focus-stat>span{max-width:85%;color:var(--muted);font-size:11.5px;line-height:1.3}
.focus-stat .focus-detail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10.5px;line-height:1.25}
.focus-stat .text-action{align-self:flex-start;margin-left:-5px;padding-top:1px}
.location-alert{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.location-alert .text-action{white-space:nowrap}

.focus-stat>b{font-family:var(--f-mono);font-size:24px;font-weight:500;letter-spacing:-.04em;line-height:1.1}
.focus-stat>b small{font-size:14px;color:var(--muted);font-weight:400}
.focus-stat>i{position:absolute;right:14px;top:14px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--muted);font-size:11px;font-style:normal}
.focus-stat.good>i{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok)}
.focus-stat.bad>i{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.overview-columns{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.85fr);gap:12px;align-items:start}
.overview-card{min-width:0;padding:15px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.overview-cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px}
.overview-cardhead h3{margin:0;font-size:13px;font-weight:650;letter-spacing:-.01em}
.text-action{padding:4px 5px;border:0;background:transparent;color:var(--accent);font:inherit;font-size:11.5px;cursor:pointer}
.text-action:hover{text-decoration:underline}
.count-badge{min-width:21px;padding:2px 6px;border-radius:99px;background:var(--soft);color:var(--muted);font:11px var(--f-mono);text-align:center}
.due-list{list-style:none;padding:0;margin:0}
.due-list li{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.due-marker{width:7px;height:7px;flex:none;border-radius:50%;background:var(--cong)}
.due-marker.g{background:var(--group)}
.due-name{display:flex;min-width:0;flex:1;flex-direction:column;line-height:1.3}
.due-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:550}
.due-name small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10.5px}
.due-list time{flex:none;font-size:11px;color:var(--muted)}
.due-list time.overdue{color:var(--bad)}
.overview-empty{margin:0;padding:9px 0;color:var(--muted);font-size:12px}
.attention-card .alerts{gap:0}
.attention-card .alert{margin-top:6px;font-size:11.5px;padding:7px 9px;border-radius:7px}
.more-alerts{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.more-alerts summary,.stats-disclosure summary{cursor:pointer;user-select:none}
.more-alerts[open]{display:flex;flex-direction:column;gap:5px}
.more-alerts[open] .alert{margin:0}
.stats-disclosure{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:11.5px}
.stats-disclosure[open]{display:flex;flex-direction:column;gap:10px}
.stats-disclosure .stats{margin:0}
.stats-disclosure .stat{min-height:62px;padding:10px 12px}
.stats-disclosure .stat b{font-size:19px}
@media(max-width:1000px){.weeks-layout{grid-template-columns:minmax(0,1fr) 220px}}
@media(max-width:760px){.weeks-layout{grid-template-columns:1fr}.week-coverage{grid-column:1;grid-row:1;position:sticky;top:0;max-height:30vh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px}.coverage-head{grid-column:1/-1;margin:0}.coverage-group{min-width:0;padding:6px 0}.coverage-names{max-height:68px;overflow:auto}#weeks{grid-column:1;grid-row:2}}
@media(max-width:900px){.overview-columns{grid-template-columns:1fr}.wrap.app-shell{grid-template-columns:190px minmax(0,1fr)}}
@media(max-width:720px){.overview-focus{grid-template-columns:1fr}.focus-stat{min-height:65px}.overview-columns{grid-template-columns:1fr}.wrap.app-shell{grid-template-columns:64px minmax(0,1fr)}}
</style>
</head>

      <div class="plan-tools"><div class="legend" id="legend"></div></div>

      <section id="view-tl" class="plan-view" data-plan-view="tl" hidden><p class="hint" data-i="hint_tl"></p><div class="panel scroll" id="tl"></div></section>

      <input type="file" id="imp-file" accept=".csv,text/csv" hidden><input type="file" id="pdf-file" accept=".pdf,application/pdf" hidden><input type="file" id="json-file" accept=".json,application/json" hidden><div class="panel" id="data"></div>

hint_tl:['Кружки после названия — интервалы между посещениями: зелёный — в норме, жёлтый — чуть за пределами, красный — далеко. Пунктирная рамка — окно для следующего посещения, полая точка — расчётная дата. <span style="color:var(--ok)">Прозрачная зелёная отметка</span> показывает рекомендованную дату, поэтому её можно сравнить с назначенным посещением. <b>Точки можно перетаскивать</b>: синюю — чтобы перенести посещение, полую — чтобы запланировать следующее.','Badges after each name show visit intervals: green on target, yellow slightly off, red far off. The dashed box is the next visit window; the hollow dot is the projected date. The <span style="color:var(--ok)">translucent green mark</span> shows the recommended date, so you can compare it with a scheduled visit. <b>Drag the dots</b>: a solid dot moves a visit, the hollow dot schedules the next one.','Los círculos junto al nombre muestran los intervalos entre visitas: verde dentro del objetivo, amarillo algo fuera y rojo muy fuera. El recuadro punteado es la ventana para la próxima visita; el punto hueco es la fecha calculada. La <span style="color:var(--ok)">marca verde translúcida</span> indica la fecha recomendada para compararla con la visita programada. <b>Arrastre los puntos</b>: el sólido mueve una visita y el hueco programa la próxima.'],
hint_weeks:['Все недели служебного года подписаны вторником. Пунктирные недели свободны. <b>Перетащите собрание или группу на нужную неделю. Чтобы добавить пионерскую неделю, перетаскивайте карточку справа — её можно использовать снова.</b> Уже запланированные и расчётные «≈» посещения тоже можно переносить. Изменения попадают в черновик.','Every week of the service year is labelled by its Tuesday. Dashed weeks are free. <b>Drag a congregation or group to a week. To add a pioneer week, drag the card on the right; you can reuse it.</b> Scheduled visits and projected “≈” items can also be moved. Changes go into a draft.','Cada semana del año de servicio está indicada por su martes. Las semanas punteadas están libres. <b>Arrastre una congregación o grupo hasta una semana. Para añadir una semana de precursores, arrastre la tarjeta de la derecha; puede volver a usarla.</b> También puede mover las visitas y las «≈» calculadas. Los cambios van a un borrador.'],
pioneer_weeks:['Пионерские недели','Pioneer weeks','Semanas de precursores'],pioneer_add:['Добавить пионерскую неделю','Add a pioneer week','Añadir una semana de precursores'],pioneer_template_hint:['Перетаскивайте этот пункт на календарь, чтобы добавить неделю. Его можно использовать снова.','Drag this item to the calendar to add a week. Reuse it as often as needed.','Arrastre este elemento al calendario para añadir una semana. Puede volver a usarlo.'],
hint_due:['Все собрания и группы по порядку ближайшего расчётного срока.','All congregations and groups, sorted by the next projected date.','Todas las congregaciones y grupos, ordenados por la próxima fecha calculada.'],
hint_sug:['Для каждого собрания и группы, которые пора планировать, — до трёх лучших недель. Учитываются окно интервала (лучше ближе к целевому), свободна ли неделя, особые периоды, пионерские недели и конгрессы, второе посещение в одном полугодии и соседние по маршруту визиты в соседние недели. Нажатие на вариант добавляет посещение в черновик.','For every congregation and group that is due, up to three best weeks. The score weighs the interval window (closest to target is best), whether the week is free, blocked periods, pioneer weeks and assemblies, a second visit in the same half-year, and nearby visits in adjacent weeks. Clicking an option adds the visit to a draft.','Para cada congregación y grupo pendiente, hasta tres mejores semanas. Se consideran la ventana del intervalo (mejor cerca del objetivo), si la semana está libre, los periodos bloqueados, semanas de precursores y asambleas, una segunda visita en el mismo semestre y visitas cercanas en semanas contiguas. Al pulsar una opción se añade la visita a un borrador.'],
hint_trips:['Поездки считаются от дома. Ближе {0} км — местное посещение, до {1} км — на машине, дальше — перелёт. Визиты в соседние недели могут объединяться в одну поездку. Для отдельного собрания режим можно задать вручную в разделе «Мой район». Километры приблизительные: по прямой × 1,2 для дороги.','Trips are counted from home. Closer than {0} km is local, up to {1} km is a drive, farther is a flight. Visits in consecutive weeks may be combined into one trip. Set a congregation’s mode manually in My circuit when needed. Distances are approximate: straight line × 1.2 for roads.','Los viajes se cuentan desde casa. A menos de {0} km es local, hasta {1} km en coche y más lejos en avión. Las visitas en semanas seguidas pueden combinarse. Si hace falta, indique el modo manualmente en Mi circuito. Las distancias son aproximadas: línea recta × 1,2 por carretera.'],
hint_blocks:['Отметьте даты или периоды, когда нельзя или нежелательно планировать посещения: отпуск, особые мероприятия, школы. Они подсвечиваются на «Шкале», «Неделях» и в круговом календаре, а попавшие в них сроки и посещения выводятся в предупреждениях. Период закрывает каждую неделю, которую он хотя бы частично захватывает.','Mark dates or periods when visits can’t or shouldn’t be scheduled: vacation, special events, schools. They are highlighted on the Timeline, Weeks and the wheel, and any due date or visit that falls into them shows up in the warnings. A period blocks every week it touches.','Marque fechas o periodos en los que no se pueden o no conviene programar visitas: vacaciones, eventos especiales, escuelas. Se resaltan en la Línea de tiempo, Semanas y el calendario circular, y las fechas o visitas que caigan en ellos aparecen en los avisos. Un periodo bloquea cada semana que toca.'],
hint_data:['Изменяйте данные собраний и групп, добавляйте и импортируйте список. Здесь показано одно контрольное значение — последнее посещение (если дата одна, это первое и последнее). Полная история находится в Плане → «По датам».','Edit congregation and group details, add entries, or import a list. This page shows one reference date — the latest visit (when there is only one, it is both the first and last). Full history is in Plan → By dates.','Edite los datos de congregaciones y grupos, añada elementos o importe una lista. Aquí se muestra una fecha de referencia — la última visita (si solo hay una, es la primera y la última). El historial completo está en Plan → Por fechas.'],
hint_wheel:['Круг — служебный год, сверху сентябрь. Ячейки под месяцами — недели (серые — пионерские недели, конгрессы и т. п., красная — текущая). Каждое внутреннее кольцо — собрание или группа: <b class="okc">зелёная полоса</b> — когда посещение должно быть по правилу, <b class="planc">синяя</b> — когда оно запланировано. Синяя внутри зелёной — интервал в норме. Нажмите на кольцо или название, чтобы выделить его.','The circle is the service year with September at the top. Cells under the months are weeks (grey: pioneer weeks, assemblies, etc.; red: this week). Each inner ring is a congregation or group: the <b class="okc">green band</b> is when the visit is due by the rule, the <b class="planc">blue mark</b> is when it is scheduled. Blue inside green means the interval is on target. Click a ring or a name to highlight it.','El círculo es el año de servicio con septiembre arriba. Las celdas bajo los meses son semanas (gris: semanas de precursores, asambleas, etc.; rojo: esta semana). Cada anillo interior es una congregación o grupo: la <b class="okc">franja verde</b> indica cuándo toca la visita según la regla y la <b class="planc">marca azul</b> cuándo está programada. Azul dentro de verde significa intervalo correcto. Pulse un anillo o un nombre para resaltarlo.'],

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').toLowerCase().replace(/[–—-]/g,' ').replace(/\s+/g,' ').trim();
const TODAY=(()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())})();
const numFmt=n=>Math.round(n).toLocaleString(lang==='en'?'en-US':lang==='es'?'es-ES':'ru-RU');
const dec1=n=>{const v=n.toFixed(1);return lang==='en'?v:v.replace('.',',')};

function model(src,events=state.events,blocks=state.blocks){

    const iv=[];for(let i=1;i<v.length;i++){const w=Math.round((v[i]-v[i-1])/WEEK);iv.push({from:v[i-1],to:v[i],w,s:st(e.type,w)})}

    const next=last!=null?last+r.w*WEEK:null,win=last!=null?[last+r.lo*WEEK,last+r.hi*WEEK]:null;

  });
  const visByWeek={};
  ents.forEach(e=>e.v.forEach(x=>{const k=monday(x);(visByWeek[k]=visByWeek[k]||[]).push({e,t:x})}));
  const conflicts=Object.entries(visByWeek).filter(([,a])=>a.length>1).map(([k,a])=>({week:+k,items:a}));
  const clash=new Set();conflicts.forEach(c=>c.items.forEach(i=>clash.add(i.e.id+'|'+i.t)));

  const allV=ents.flatMap(e=>e.v),allN=ents.map(e=>e.next).filter(x=>x!=null);

  return{ents,conflicts,clash,evByWeek,visByWeek,visBlocked,first,lastV,lastN:allN.length?Math.max(...allN):TODAY,halves};

function chipVisit(e,x,m){

}
const chipProj=e=>`<span class="chip ${e.type} proj ${e.sp?'special':''}" title="${t('proj_tip',RULE[e.type].w)}">≈ ${F(e.next,false)}${e.blk?' · '+esc(e.blk.label||t('special_period')):''}</span>`;

/* ================= Полугодия ================= */
function coverage(m){
  const all=m.ents.flatMap(e=>e.v);if(!all.length)return{halves:[],years:[],gapCount:0};
  const lastP=Math.max(...all),firstP=Math.min(...all);
  const halves=m.halves.map(k=>({k,a:halfStart(k),b:halfEnd(k)})).filter(h=>h.a<=lastP&&h.b>firstP).map(h=>{
    const cs=m.ents.filter(e=>e.type==='c'&&e.v.length&&e.v[0]<h.b),cnt=e=>e.v.filter(x=>x>=h.a&&x<h.b).length;
    return{...h,total:cs.length,miss:cs.filter(e=>cnt(e)===0),dbl:cs.filter(e=>cnt(e)>1)}});
  const years=[];
  for(let y=syOf(firstP);y<=syOf(lastP);y++){const a=Date.UTC(y,8,1),b=Date.UTC(y+1,8,1);
    const gs=m.ents.filter(e=>e.type==='g'&&e.v.length&&e.v[0]<b);if(!gs.length)continue;const cnt=e=>e.v.filter(x=>x>=a&&x<b).length;
    years.push({y,a,b,total:gs.length,miss:gs.filter(e=>cnt(e)===0),dbl:gs.filter(e=>cnt(e)>1)})}
  return{halves,years,gapCount:halves.reduce((n,h)=>n+h.miss.length+h.dbl.length,0)+years.reduce((n,y)=>n+y.miss.length+y.dbl.length,0)};
}
function renderCover(m,cov){

  const card=(x,kind,label)=>{const fut=x.b>TODAY,cur=TODAY>=x.a&&TODAY<x.b;
    return `<div class="cv ${cur?'now':''}"><span class="k">${kind}${cur?' · '+t('now'):''}</span><h4>${label}</h4>${!x.miss.length&&!x.dbl.length?`<span class="ok">✓ ${t('cv_all',x.total)}</span>`:''}${x.miss.length?`<span><b class="bad">${fut?t('not_planned_c'):t('not_visited_c')}:</b> ${nm(x.miss)}</span>`:''}${x.dbl.length?`<span><b class="warn">${t('twice')}:</b> ${nm(x.dbl)}</span>`:''}</div>`};
  document.getElementById('cover').innerHTML=cov.halves.map(h=>card(h,t('cv_c'),halfLabel(h.k))).join('')+cov.years.map(y=>card(y,t('cv_g'),syLabel(y.y))).join('');
}
function renderHalf(m){
  const cov=coverage(m);renderCover(m,cov);

  const inScope=k=>cov.halves.some(h=>h.k===k);

      let html=vs.map(x=>`<div class="cell" style="gap:2px">${chipVisit(e,x,m)}</div>`).join('');
      if(projHere)html+=chipProj(e);

      if(!vs.length&&scoped)html=(projHere?`<span class="miss">${t('not_planned_c')}</span>`:`<span class="miss">${t('no_visit')}</span>`)+html;
      return `<td class="${e.type==='c'&&vs.length>1?'dbl':''}"><div class="cell">${html||'<span class="dash">—</span>'}</div></td>`;
    }).join('');
    return `<tr><td class="name"><div class="nm">${esc(e.name)}${gtag(e)}</div><div class="city">${esc(e.city)}</div></td>${cells}</tr>`;

    ${sections(m).map(x=>`<tr class="sect"><td colspan="${m.halves.length+1}">${x.t}</td></tr>${x.list.map(row).join('')}`).join('')}</tbody></table>`;
}
const emptyState=()=>`<div class="empty"><p>${t('empty')}</p><button class="btn primary" type="button" data-goto="data">${t('go_data')}</button></div>`;

/* ================= Шкала ================= */
let TL0=Date.UTC(2025,8,1),TL1=Date.UTC(2028,4,1);
const pct=v=>Math.max(0,Math.min(100,(v-TL0)/(TL1-TL0)*100));
function renderTl(m){
  if(!m.ents.length){document.getElementById('tl').innerHTML=emptyState();return}
  TL0=Date.UTC(syOf(m.first),8,1);{const e=new Date(Math.max(m.lastN,TODAY)+40*DAY);TL1=Date.UTC(e.getUTCFullYear(),e.getUTCMonth()+1,1)}
  const months=Math.round((TL1-TL0)/(30.44*DAY));
  const bands=withLabels=>{let h='',i=0;
    for(let k=halfKey(TL0);halfStart(k)<TL1;k=nextHalf(k)){const L=pct(Math.max(halfStart(k),TL0)),R=pct(Math.min(halfEnd(k),TL1));
      h+=`<div class="band ${i%2?'alt':''}" style="left:${L}%;width:${R-L}%"></div>`;if(withLabels)h+=`<div class="hlabel" style="left:${L}%">${halfLabel(k)}</div>`;i++}
    validBlocks().forEach(b=>{const a=Math.min(P(b.from),P(b.to)),z=Math.max(P(b.from),P(b.to))+DAY;if(z<=TL0||a>=TL1)return;h+=`<div class="band ${bCls(b)}" style="left:${pct(a)}%;width:${pct(z)-pct(a)}%" title="${bName(b)}"></div>`});
    return h};
  let ticks='';for(let v=TL0;v<TL1;){const x=new Date(v);ticks+=`<div class="mline" style="left:${pct(v)}%"></div><div class="mtick" style="left:${pct(v)}%">${MON_T[lang][x.getUTCMonth()]}${x.getUTCMonth()===0?' '+String(x.getUTCFullYear()).slice(2):''}</div>`;v=Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,1)}
  const row=e=>{
    let h=bands(false);

    if(e.next!=null)h+=`<div class="seg proj" style="left:${pct(e.last)}%;width:${pct(e.next)-pct(e.last)}%"></div>`;
    e.v.forEach(x=>h+=`<i class="dot ${e.type} ${m.clash.has(e.id+'|'+x)?'conflict':''}" style="left:${pct(x)}%" title="${F(x)} — ${t('drag_move')}" data-eid="${esc(e.id)}" data-iso="${ISO(x)}"></i>`);
    if(e.next!=null)h+=`<i class="dot proj ${e.sp?'special':''}" style="left:${pct(e.next)}%" title="≈ ${F(e.next)} — ${t('drag_plan')}" data-eid="${esc(e.id)}" data-iso="proj"></i>`;
    h+=`<div class="today" style="left:${pct(TODAY)}%"></div>`;
    const badges=e.iv.map(i=>`<span class="ivb ${i.s}" title="${F(i.from,false)} → ${F(i.to,false)}: ${i.w} ${t('u_wk')} (${dec1(toMo(i.w))} ${t('u_mo')}) · ${ivWord(e.type,i.w)}">${U(i.w,true)}</span>`).join('')||`<span class="ivb none" title="${t('one_visit_tip')}">?</span>`;
    return `<div class="tl-row"><div class="tl-label"><div class="nmrow"><span class="nm">${esc(e.name)}${gtag(e)}</span>${badges}</div><div class="city">${esc(e.city)}</div></div><div class="tr">${h}</div></div>`;
  };
  const sect=x=>`<div class="tl-row sect"><div class="tl-label">${x}</div><div></div></div>`;
  const el=document.getElementById('tl');
  el.innerHTML=`<div class="tl" style="min-width:${Math.max(900,months*52)}px"><div class="tl-head"><div class="tl-label"></div><div class="tr">${bands(true)}${ticks}<div class="today" style="left:${pct(TODAY)}%"><span>${t('today')}</span></div></div></div>
    ${sections(m).map(x=>sect(x.t)+x.list.map(row).join('')).join('')}</div>`;
}

/* ================= Недели ================= */
let curSY=syOf(TODAY);
function syBounds(m){const lo=Math.min(syOf(m.first),syOf(TODAY)),hi=Math.max(syOf(m.lastN),syOf(TODAY));return[lo,hi]}
function renderWeekCoverage(m){
  const start=Date.UTC(curSY,8,1),mid=Date.UTC(curSY+1,2,1),end=Date.UTC(curSY+1,8,1);

function renderWeeks(m){

/* ================= География и поездки ================= */
const ROAD=1.2;
const hav=(a,b)=>{if(!a||!b||a.lat==null||b.lat==null||isNaN(a.lat)||isNaN(b.lat))return null;const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))};
const modeOf=d=>d==null?'unk':d<state.settings.local?'local':d<=state.settings.drive?'drive':'fly';
function trips(m){
  const H=state.home,all=[];m.ents.forEach(e=>e.v.forEach(x=>all.push({e,t:x,k:monday(x)})));all.sort((a,b)=>a.t-b.t);
  const out=[];let cur=null;
  all.forEach(x=>{const dh=hav(H,x.e),override=['local','drive','fly'].includes(x.e.travelMode)?x.e.travelMode:'',md=override||modeOf(dh);x.override=override;
    if(md==='local'||md==='unk'){out.push({stops:[x],mode:md,km:dh!=null?2*dh*ROAD:0,start:x.t,end:x.t});cur=null;return}
    if(cur&&cur.override===override&&x.k-cur.lastK===WEEK){const prev=cur.stops[cur.stops.length-1],dp=hav(prev.e,x.e);if(dp!=null&&dp<dh){cur.stops.push(x);cur.lastK=x.k;cur.end=x.t;return}}
    cur={stops:[x],lastK:x.k,start:x.t,end:x.t,mode:null,override};out.push(cur)});
  out.forEach(tr=>{if(tr.mode)return;let km=0,prev=H,fly=false;tr.stops.forEach(sx=>{const d=hav(prev,sx.e)||0;if(d>state.settings.drive)fly=true;km+=d;prev=sx.e});const back=hav(prev,H)||0;if(back>state.settings.drive)fly=true;km+=back;tr.mode=tr.override|| (fly?'fly':'drive');tr.km=tr.mode==='fly'?km:km*ROAD});

}

/* ================= Подбор недель ================= */
let sugH='sy';
function horizonEnd(){if(sugH==='sy')return Date.UTC(syOf(TODAY)+1,8,1)-DAY;if(sugH==='half')return halfEnd(nextHalf(halfKey(TODAY)))-DAY;return TODAY+365*DAY}
const sugList=m=>{const he=horizonEnd();return m.ents.filter(e=>e.last!=null&&e.last+RULE[e.type].lo*WEEK<=he).sort((a,b)=>a.next-b.next)};
function suggestFor(e,m,taken){
  if(e.last==null)return[];
  const R=RULE[e.type],minK=monday(TODAY)+WEEK;let a=e.last+R.wlo*WEEK,b=e.last+R.whi*WEEK;if(monday(b)<minK){a=minK;b=minK+8*WEEK}
  const homeD=hav(state.home,e),res=[];
  for(let k=monday(Math.max(a,minK));k<=monday(b);k+=WEEK){
    const tue=k+DAY;if((m.visByWeek[k]||[]).length||(taken&&taken.has(k)))continue;
    const bk=blockFor(tue);if(bk&&bk.level==='no')continue;
    const w=Math.round((tue-e.last)/WEEK);let sc=Math.abs(w-R.w)*3;const why=[];
    if(w<R.lo||w>R.hi){sc+=12;why.push(w<R.lo?t('early'):t('late'))}

    if(bk){sc+=25;why.push((bk.label||t('special_period'))+' — '+t('lv_avoid'))}
    if(e.type==='c'&&e.v.some(x=>halfKey(x)===halfKey(tue))){sc+=40;why.push(t('second_in_half'))}
    if(modeOf(homeD)!=='local'){let best=null;[k-WEEK,k+WEEK].forEach(kk=>(m.visByWeek[kk]||[]).forEach(x=>{if(x.e.id===e.id)return;const d=hav(x.e,e);if(d!=null&&(best==null||d<best.d))best={d,x}}));
      if(best&&best.d<400){sc-=15;why.unshift(t('near',best.x.e.name,numFmt(best.d)))}}

/* ----- CSV ----- */
function parseCSV(s_){s_=s_.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<s_.length;i++){const c=s_[i];if(q){if(c==='"'){if(s_[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s_[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const CSV_HEAD=['Number','Name','City','State / Province','Country','Venue Name','Venue Street','Venue City','Venue State / Province','Circuit','Circuit Section','Branch','Midweek Day','Midweek Time','Weekend Day','Weekend Time','Language','Language Forms','Sign Language','Notes','Routing Notes','Visit Notes','Prison Witnessing','Prison Witnessing Note','Phone Number','VP Phone Number','KML Color','JW.org Meeting Times URL','Type','Visits','Latitude','Longitude','Travel Mode'];
function guessMatch(r){if(r.num){const e=state.ents.find(e=>e.num&&String(e.num)===r.num);if(e)return e.id}
  const n=norm(r.name),c=norm(r.city),vc=norm(r.vcity),cands=state.ents.filter(e=>norm(e.name)===n);
  const byCity=cands.find(e=>{const ec=norm(e.city);return(c&&ec.includes(c))||(vc&&ec.includes(vc))});if(byCity)return byCity.id;return cands.length===1&&!c?cands[0].id:''}
function readImport(text){
  const rows=parseCSV(text);
  if(rows.length<2){impMsg=`<span class="bad">${t('csv_empty')}</span>`;impRows=null;renderData();return}
  const H=rows[0].map(h=>h.trim().toLowerCase()),col=n=>H.indexOf(n.toLowerCase());
  if(col('Name')<0){impMsg=`<span class="bad">${t('csv_noname')}</span>`;impRows=null;renderData();return}
  const get=(r,n)=>{const i=col(n);return i<0?'':String(r[i]??'').trim()};
  impRows=rows.slice(1).map(r=>{
    const x={num:get(r,'Number'),name:get(r,'Name'),city:get(r,'City'),st:get(r,'State / Province'),vcity:get(r,'Venue City'),lang:get(r,'Language'),color:get(r,'KML Color')};
    const travelMode=get(r,'Travel Mode').toLowerCase();x.travelMode=['local','drive','fly'].includes(travelMode)?travelMode:'';
    const street=get(r,'Venue Street'),vst=get(r,'Venue State / Province');x.addr=street?[street,x.vcity,vst].filter(Boolean).join(', '):'';
    const la=parseFloat(get(r,'Latitude')),lo=parseFloat(get(r,'Longitude'));if(!isNaN(la)&&!isNaN(lo)){x.lat=la;x.lon=lo}
    const ty=get(r,'Type').toLowerCase();x.type=ty?(/^g|груп|grupo/.test(ty)?'g':'c'):(/group|груп|grupo/i.test(x.name)?'g':'c');
    x.visits=get(r,'Visits').split(/[;\s]+/).filter(isIso);x.match=guessMatch(x);x.on=true;return x}).filter(x=>x.name);
  impMsg='';renderData();document.getElementById('data').scrollIntoView({block:'start'});
}
const dispCity=x=>{const base=[x.city,x.st].filter(Boolean).join(' ');return x.vcity&&norm(x.vcity)!==norm(x.city)?base+' · '+x.vcity:base};
function importHTML(){
  if(!impRows)return'';
  const opts=r=>`<option value="">${t('as_new')}</option>`+state.ents.map(e=>`<option value="${esc(e.id)}"${r.match===e.id?' selected':''}>${esc(e.name)} · ${esc(e.city)}</option>`).join('');

  <div class="scroll"><table><thead><tr><th></th><th>${t('from_file')}</th><th>${t('type')}</th><th>${t('match_with')}</th><th>${t('dates')}</th></tr></thead><tbody>${
    impRows.map((r,i)=>`<tr><td><input type="checkbox" id="imp-on-${i}" data-imp="${i}" data-k="on"${r.on?' checked':''}></td>
      <td><div class="nm">${esc(r.name)}</div><div class="city">${esc(dispCity(r))}${r.num?' · №'+esc(r.num):''}${r.lang?' · '+esc(r.lang):''}</div></td>
      <td><select id="imp-t-${i}" data-imp="${i}" data-k="type"><option value="c"${r.type==='c'?' selected':''}>${t('cong_c')}</option><option value="g"${r.type==='g'?' selected':''}>${t('grp_c')}</option></select></td>
      <td><select id="imp-m-${i}" data-imp="${i}" data-k="match">${opts(r)}</select> ${r.match?'':`<span class="badge-new">${t('new')}</span>`}</td>
      <td class="mono">${r.visits.length||'—'}</td></tr>`).join('')}</tbody></table></div>
  <div class="acts"><button class="btn primary" type="button" data-act="imp-apply">${t('apply_imp')}</button><button class="btn" type="button" data-act="imp-cancel">${t('cancel')}</button></div></div>`;
}
function applyImport(){let upd=0,add=0;
  impRows.filter(r=>r.on).forEach(r=>{const e=r.match&&state.ents.find(x=>x.id===r.match);
    if(e){Object.assign(e,{num:r.num||e.num,lang:r.lang||e.lang,color:r.color||e.color,st:r.st||e.st,vcity:r.vcity||e.vcity,addr:r.addr||e.addr,type:r.type});if(r.travelMode)e.travelMode=r.travelMode;if(r.lat!=null){e.lat=r.lat;e.lon=r.lon}
      e.visits=[...new Set([...e.visits.filter(isIso),...r.visits])].sort();upd++}
    else{const twin=r.lat==null&&state.ents.find(x=>x.lat!=null&&x.addr&&norm(x.addr)===norm(r.addr));
      state.ents.push({id:'u'+Date.now().toString(36)+add,type:r.type,name:r.name,city:dispCity(r),num:r.num,lang:r.lang,color:r.color,st:r.st,vcity:r.vcity,addr:r.addr,travelMode:r.travelMode||undefined,lat:r.lat!=null?r.lat:twin?twin.lat:undefined,lon:r.lat!=null?r.lon:twin?twin.lon:undefined,visits:r.visits.length?r.visits:['']});add++}});
  impRows=null;impMsg=`<span class="ok">${t('imp_done',upd,add)}</span>`;state.example=false;save();renderAll(true)}

    <label class="srow chk"><input type="checkbox" id="s-pioneer"${S_.flagPioneer?' checked':''}><span>${t('s_avoid_ev')}</span></label>
    <button class="btn" type="button" id="s-rules-reset">${t('s_rules_reset')}</button>
  </div>
  <div class="panel spanel"><h3>${t('s_data')}</h3>
    <p class="note">${t('s_data_hint')}</p>
    <div class="sbtns"><button class="btn" type="button" id="s-backup">${t('s_backup')}</button><button class="btn" type="button" id="s-restore">${t('s_restore')}</button></div>
    <div class="sbtns"><button class="btn danger" type="button" id="s-clean">${pendingDel==='clean'?t('s_clean_confirm'):t('s_clean')}</button></div>
    <div class="sbtns"><button class="btn" type="button" id="s-onboarding-preview">${t('setup_test_btn')}</button></div><p class="note">${t('setup_test_hint')}</p>
    <p class="note" id="s-msg">${setMsg}</p>
  </div></div>`;
}
let setMsg='';
const setEl=document.getElementById('settings');
setEl.addEventListener('change',ev=>{const x=ev.target,S_=state.settings;
  const annualMatch=x.id.match(/^s-annual-(caCo|caBr|convention)$/);if(annualMatch){const key=annualMatch[1],v=Math.max(0,Math.min(12,parseInt(x.value,10)||0));S_.annualCounts[key]=v;x.value=v;save();renderAll(false);renderSettings();return}
  if(x.id==='s-style'||x.id==='s-theme'){S_[x.id==='s-style'?'style':'theme']=x.value;applyAppearance();save();return}
  if(x.id==='s-lang'){S_.lang=x.value;lang=x.value;save();applyStatic();renderAll(true);return}
  if(x.id==='s-circuit'){S_.circuit=x.value.trim();save();applyStatic();return}
  if(x.id==='s-overseer'){S_.overseer=x.value.trim();save();applyStatic();return}
  if(x.id==='s-home-name'){state.home.name=x.value;save();renderAll(false);return}
  if(x.id==='s-home-co'){const mm=x.value.match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);if(mm){state.home.lat=+mm[1];state.home.lon=+mm[2];save();renderAll(false)}return}
  if(x.id==='s-local'||x.id==='s-drive'){const v=Math.max(+x.min,Math.min(+x.max,parseInt(x.value)||0));S_[x.id==='s-local'?'local':'drive']=v;save();applyStatic();renderAll(false);return}
  const rm=x.id.match(/^s-([cg])-(w|lo|hi)$/);
  if(rm){const v=parseInt(x.value);if(!isNaN(v)&&v>0){S_[rm[1]][rm[2]]=v;const R_=S_[rm[1]];if(R_.lo>R_.w)R_.lo=R_.w;if(R_.hi<R_.w)R_.hi=R_.w;setRules();save();applyStatic();renderAll(true)}return}
  if(x.id==='s-pioneer'){S_.flagPioneer=x.checked;save();renderAll(false)}});
setEl.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;const S_=state.settings;if(b.dataset.u){setUnit(b.dataset.u);applyStatic();renderAll(true);return}if(b.dataset.mix!==undefined){setMix(b.dataset.mix==='1');renderAll(false);return}
  if(b.dataset.palette){S_.palette=b.dataset.palette;applyAppearance();save();renderSettings();return}
  if(b.id==='s-onboarding-preview'){onboardingPreview=true;setMsg='';renderOnboarding();return}
  if(b.id==='s-rules-reset'){S_.c={...DEF_SET.c};S_.g={...DEF_SET.g};setRules();save();applyStatic();renderAll(true);return}
  if(b.id==='s-backup'){const data=JSON.stringify({app:'route-planner',v:1,saved:new Date().toISOString(),state:{...state,draft:null}},null,1);setMsg=await saveFile(fileTag()+'-backup-'+ISO(Date.now())+'.json',data,data);renderSettings();return}
  if(b.id==='s-restore'){document.getElementById('json-file').click();return}
  if(b.id==='s-clean'){if(pendingDel==='clean'){setMsg=t('s_cleaned');startOver()}else{pendingDel='clean';renderSettings()}return}
});
document.getElementById('json-file').addEventListener('change',ev=>{const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(String(rd.result)),s_=j&&j.state;if(!s_||!Array.isArray(s_.ents))throw new Error('format');
      state={ents:s_.ents,events:s_.events||[],blocks:s_.blocks||[],annualSlots:s_.annualSlots||{},home:s_.home||state.home,settings:Object.assign({},DEF_SET,s_.settings||{}),draft:null,example:false};
      state.settings.annualCounts=Object.assign({},DEF_SET.annualCounts,s_.settings?.annualCounts||{});lang=state.settings.lang;setRules();setMsg=t('s_restored');save();applyStatic();renderAll(true)}
    catch(e){setMsg=`<span class="bad">${t('s_restore_fail')}</span>`;renderSettings()}};rd.readAsText(f)});

/* ================= Приветствие ================= */
function renderWelcome(){const el=document.getElementById('welcome');
  if(state.example){el.innerHTML=`<div class="welcome"><div><b>${t('wl_title')}</b><p>${t('wl_text')}</p></div><div class="sbtns"><button class="btn primary" type="button" data-wl="clean">${t('wl_clean')}</button><button class="btn" type="button" data-wl="keep">${t('wl_keep')}</button><button class="btn" type="button" data-goto="settings">${t('tab_settings')}</button></div></div>`;return}
  el.innerHTML='';}
document.getElementById('welcome').addEventListener('click',ev=>{const b=ev.target.closest('[data-wl]');if(!b)return;
  if(b.dataset.wl==='keep'){state.example=false;save();renderWelcome();return}
  if(b.dataset.wl==='clean'){startOver()}});

/* ================= Круговой календарь ================= */
let wSel=null;const WC=320;
const pol=(r,a)=>{const x=(a-90)*Math.PI/180;return[WC+r*Math.cos(x),WC+r*Math.sin(x)]},f2=n=>n.toFixed(2);
function arc(r1,r2,a1,a2){if(a2-a1>=359.99)a2=a1+359.99;const L=a2-a1>180?1:0,[x1,y1]=pol(r2,a1),[x2,y2]=pol(r2,a2),[x3,y3]=pol(r1,a2),[x4,y4]=pol(r1,a1);return `M${f2(x1)} ${f2(y1)}A${r2} ${r2} 0 ${L} 1 ${f2(x2)} ${f2(y2)}L${f2(x3)} ${f2(y3)}A${r1} ${r1} 0 ${L} 0 ${f2(x4)} ${f2(y4)}Z`}
function renderWheel(m){
  const[lo,hi]=syBounds(m);curSY=Math.max(lo,Math.min(hi,curSY));
  const y0=Date.UTC(curSY,8,1),y1=Date.UTC(curSY+1,8,1),ang=v=>(v-y0)/(y1-y0)*360;let h='';
  for(let i=0;i<12;i++){const mo=(8+i)%12,yy=curSY+(i>=4?1:0),A=ang(Date.UTC(yy,mo,1)),B=ang(Date.UTC(mo===11?yy+1:yy,(mo+1)%12,1));
    h+=`<path class="wm" style="--h:${(200+i*30)%360}" d="${arc(264,308,A,B)}"/>`;const mid=(A+B)/2,[tx,ty]=pol(286,mid),rot=mid>90&&mid<270?mid+180:mid;
    h+=`<text class="wmt" x="${f2(tx)}" y="${f2(ty)}" text-anchor="middle" dominant-baseline="central" transform="rotate(${f2(rot)} ${f2(tx)} ${f2(ty)})">${MON_F[lang][mo].toUpperCase()}</text>`}
  for(let k=monday(y0);k<y1;k+=WEEK){const a=Math.max(k,y0),b=Math.min(k+WEEK,y1);if(b<=a)continue;const tue=k+DAY,bk=blockFor(tue);
    const cls=(TODAY>=k&&TODAY<k+WEEK)?'now':bk?bCls(bk):(m.evByWeek[k]?'ev':'');h+=`<path class="wkc ${cls}" d="${arc(246,261,ang(a),ang(b))}"><title>${m.evByWeek[k]?esc(m.evByWeek[k].join(', ')):t('week')}</title></path>`}
  const list=sections(m).flatMap(x=>x.list),n=list.length,rOut=240,rIn=114,step=(rOut-rIn)/Math.max(n,1),gap=Math.min(2,step*.25);
  list.forEach((e,i)=>{const r2=rOut-i*step,r1=r2-step+gap,R=RULE[e.type];let g=`<path class="track" d="${arc(r1,r2,0,360)}"/>`;
    e.v.forEach(x=>{const a=Math.max(x+R.lo*WEEK-3*DAY,y0),b=Math.min(x+R.hi*WEEK+4*DAY,y1);if(b>a)g+=`<path class="due" d="${arc(r1,r2,ang(a),ang(b))}"/>`});
    e.v.forEach(x=>{const k=monday(x),a=Math.max(k,y0),b=Math.min(k+WEEK,y1);if(b>a)g+=`<path class="plan ${m.clash.has(e.id+'|'+x)?'conflict':''}" d="${arc(r1-.5,r2+.5,ang(a),ang(b))}"/>`});
    h+=`<g class="ring ${wSel===e.id?'on':''}" data-id="${esc(e.id)}"><title>${i+1}. ${esc(e.name)} — ${esc(e.city)}</title>${g}</g>`});
  [0,ang(Date.UTC(curSY+1,2,1))].forEach(a=>{const[x1,y1_]=pol(110,a),[x2,y2]=pol(308,a);h+=`<line class="halfline" x1="${f2(x1)}" y1="${f2(y1_)}" x2="${f2(x2)}" y2="${f2(y2)}"/>`});
  if(TODAY>=y0&&TODAY<y1){const a=ang(TODAY),[x1,y1_]=pol(110,a),[x2,y2]=pol(262,a);h+=`<line class="nowline" x1="${f2(x1)}" y1="${f2(y1_)}" x2="${f2(x2)}" y2="${f2(y2)}"/>`}
  h+=`<circle class="ctr" cx="${WC}" cy="${WC}" r="108"/>`;
  const se=wSel&&list.find(e=>e.id===wSel);
  if(se){h+=`<text class="ct1" x="${WC}" y="${WC-26}" text-anchor="middle" font-size="15">${esc(se.name)}</text><text class="ct2" x="${WC}" y="${WC-6}" text-anchor="middle">${esc(se.city)} · ${se.type==='c'?t('cong'):t('grp')}</text>
      <text class="ct2" x="${WC}" y="${WC+16}" text-anchor="middle">${t('intervals')}, ${unit==='m'?t('u_mo'):t('u_wk')}: ${se.iv.map(x=>U(x.w,true)).join(' · ')||'—'}</text><text class="ct2" x="${WC}" y="${WC+36}" text-anchor="middle">${t('next_eq')} ${se.next!=null?F(se.next):'—'}</text>`}
  else h+=`<text class="ct1" x="${WC}" y="${WC-4}" text-anchor="middle" font-size="34">${syLabel(curSY)}</text><text class="ct2" x="${WC}" y="${WC+22}" text-anchor="middle">${t('service_year')}</text>`;
  const svg=document.getElementById('wheel');svg.innerHTML=h;svg.classList.toggle('dim',!!se);
  document.getElementById('wlist').innerHTML=list.map((e,i)=>`<li data-id="${esc(e.id)}" class="${wSel===e.id?'on':''}"><span class="rn">${i+1}</span><i class="sw ${e.type}"${e.color?` style="background:${esc(e.color)}"`:''}></i><div><div>${esc(e.name)}</div><div class="city">${esc(e.city)}</div></div></li>`).join('');
  document.getElementById('wy-label').textContent=`${cap(MON_T[lang][8])} ${curSY} – ${cap(MON_T[lang][7])} ${curSY+1}`;
  document.getElementById('wy-prev').disabled=curSY<=lo;document.getElementById('wy-next').disabled=curSY>=hi;
}
const wPick=ev=>{const x=ev.target.closest('[data-id]');if(!x)return;wSel=wSel===x.dataset.id?null:x.dataset.id;renderWheel(model())};
document.getElementById('wheel').addEventListener('click',wPick);document.getElementById('wlist').addEventListener('click',wPick);
document.getElementById('wy-prev').addEventListener('click',()=>{curSY--;const m=model();renderWheel(m);renderWeeks(m)});
document.getElementById('wy-next').addEventListener('click',()=>{curSY++;const m=model();renderWheel(m);renderWeeks(m)});

/* ================= Общее ================= */
function renderAll(withData){
  const m=model();
  renderWelcome();renderStats(m);renderHalf(m);renderTl(m);renderWeeks(m);renderPlanDates(m);renderDue(m);renderWheel(m);renderDraft(m);renderSug(m);renderTrips(m);
  if(withData){renderData();renderBlocks();renderSettings()}
}
const tabs=[...document.querySelectorAll('.app-sidebar [data-v]')];
const planTabs=[...document.querySelectorAll('#plan-tabs [data-plan]')];
const planViews=['weeks','dates','half','tl','due','sug','wheel'];
const PLAN_VIEW_KEY='il25u-route-plan-view-v2';
let currentPlanView='weeks';
function show(v){
  if(planViews.includes(v))currentPlanView=v;
  const top=planViews.includes(v)?'plan':v;
  const valid=['overview','plan','trips','blocks','data','settings'].includes(top)?top:'overview';
  tabs.forEach(b=>{const active=b.dataset.v===valid;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});
  document.querySelectorAll('.top-view').forEach(x=>x.hidden=x.id!=='view-'+valid);
  document.querySelectorAll('[data-plan-view]').forEach(x=>x.hidden=x.dataset.planView!==currentPlanView);
  planTabs.forEach(b=>{const active=b.dataset.plan===currentPlanView;b.classList.toggle('active',active);b.setAttribute('aria-selected',active?'true':'false')});
  try{store.set(TABKEY,valid);store.set(PLAN_VIEW_KEY,currentPlanView)}catch(e){}
  if(valid==='plan'&&currentPlanView==='tl'){const el=document.getElementById('tl'),tr=el.querySelector('.tl-head .tr');if(tr){el.scrollLeft=Math.max(0,tr.offsetLeft+tr.offsetWidth*pct(TODAY)/100-el.clientWidth*0.4)}}
}
tabs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
planTabs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.plan)));
document.addEventListener('click',ev=>{const g=ev.target.closest('[data-goto]');if(g){show(g.dataset.goto);window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-show-week]');if(!b)return;const date=b.dataset.showWeek;curSY=syOf(P(date));renderWeeks(model());show('weeks');requestAnimationFrame(()=>{const cell=document.querySelector(`#weeks [data-k="${monday(P(date))}"]`);if(cell)cell.scrollIntoView({block:'center',behavior:'smooth'})})});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-show-plan]');if(!b)return;show(b.dataset.showPlan);window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('open-settings').addEventListener('click',()=>{show('settings');window.scrollTo({top:0,behavior:'smooth'})});
function setUnit(u){unit=u;document.querySelectorAll('[data-u]').forEach(b=>b.setAttribute('aria-checked',b.dataset.u===u?'true':'false'));try{store.set('il25u-unit',u)}catch(e){}}
function setMix(v){mix=v;document.querySelectorAll('[data-mix]').forEach(b=>b.setAttribute('aria-checked',(b.dataset.mix==='1')===v?'true':'false'));try{store.set('il25u-mix',v?'1':'0')}catch(e){}}
let first='overview';try{first=store.get(TABKEY)||'overview';const pv=store.get(PLAN_VIEW_KEY);if(planViews.includes(pv))currentPlanView=pv;else if(planViews.includes(first))currentPlanView=first}catch(e){}
if(planViews.includes(first))first='plan';
if(!tabs.some(b=>b.dataset.v===first))first='overview';
setMix(mix);setUnit(unit);applyStatic();renderAll(true);show(first);renderOnboarding();
</script>
